# Notion sync — the read surface follows the repo, with nobody waiting.
#
# Runs notion-repo-sync on every docs push, which is what makes "session end"
# equal "git push".
#
# Known trade-off, accepted: a crash between a page's delete and its re-append
# leaves that page blank until the next run — the state hash only advances on
# success, so the next push (or a workflow_dispatch) rebuilds exactly the
# failed page. A blank page that self-heals beats a half-written page that
# reports success.
#
# The state-file commit uses the default GITHUB_TOKEN, whose pushes do not
# trigger new workflow runs; [skip ci] is belt and braces.
name: Notion sync

on:
  push:
    branches: [main]            # ← the branch your config names
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        type: choice
        options: [sync, full]
        default: sync

concurrency:
  group: notion-sync
  cancel-in-progress: false     # never cancel between a delete and a re-append

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Append decisions retrieve old content by blob hash; a shallow clone
          # would make every append a full replace.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npx notion-repo-sync ${{ inputs.mode || 'sync' }}

      - name: Commit state file
        run: |
          STATE=docs/.notion-ids.state.json   # ← match your config
          if git diff --quiet "$STATE"; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "notion-sync"
          git config user.email "noreply@github.com"
          git add "$STATE"
          git commit -m "Notion sync state [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
