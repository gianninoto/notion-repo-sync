# Notion sync — the read surface follows the repo, with nobody waiting.
#
# Runs on every docs push, which is what makes "session end" equal
# "git push", and every Friday as a `full` run so dated pages move in a week
# nobody pushed. Everything else — checkout with full history, the engine,
# the state-file commit replayed onto the tip — is inside the action.
#
# Known trade-off, accepted: a crash between a page's delete and its re-append
# leaves that page blank until the next run; the state only advances on
# success, so the next run rebuilds exactly that page.
name: Notion sync

on:
  push:
    branches: [main]            # ← the branch your config names
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'package.json'            # a re-pin should run the new engine at once
      - '.github/workflows/notion-sync.yml'
  schedule:
    - cron: '0 14 * * 5'        # Friday 14:00 UTC, always `full`
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        type: choice
        options: [sync, full]
        default: sync

concurrency:
  group: notion-sync
  cancel-in-progress: false     # never cancel between a delete and a re-append

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # the state-file commit
    steps:
      # Pin to a commit sha; auto-updating a workflow's code is how reviewed
      # files change underneath you.
      - uses: gianninoto/notion-repo-sync@<commit-sha>
        with:
          token: ${{ secrets.NOTION_TOKEN }}
          mode: ${{ inputs.mode }}
          state-file: docs/.notion-ids.state.json   # ← match your config
